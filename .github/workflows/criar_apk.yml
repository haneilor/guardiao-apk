name: Criar APK Guardiao

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Licenças do Android
        run: |
          # Garante que o arquivo buildozer.spec aceite as licenças do Android
          if [ -f buildozer.spec ]; then
            sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true
            sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true
          fi

      - name: Compilar APK com Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          repository_root: .

      - name: Salvar o APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-guardiao
          path: ${{ steps.buildozer.outputs.filename }}
          
