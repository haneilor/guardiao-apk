name: Criar APK Guardiao

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Mudado para 22.04 por maior estabilidade de pacotes móveis

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Python 3.10 reduz problemas de sintaxe no p4a antigo

      - name: Instalar Dependências do Sistema e Java
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libdb-dev libsqlite3-dev libffi-dev uuid-dev libgdbm-compat-dev
          sudo apt-get install -y ccache clang
          
      - name: Instalar Buildozer e ferramentas corretas
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" "buildozer==1.5.0" wheel # Travando em versões ultra estáveis

      - name: Configurar Licenças do Android
        run: |
          if [ -f buildozer.spec ]; then
            sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true
            sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true
          fi

      - name: Compilar APK com Buildozer
        run: |
          buildozer android debug
        env:
          # Força o buildozer a ignorar caminhos globais corrompidos do runner
          APP_ANDROID_ARCHS: "arm64-v8a"

      - name: Salvar o APK pronto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-guardiao
          path: bin/*.apk
