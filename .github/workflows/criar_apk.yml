name: Criar APK Guardiao

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-python-version: "3.10"

      - name: Instalar Dependências de Compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev liblzma-dev lzma
          pip install --upgrade pip
          pip install cython buildozer tools-python-for-android

      # ==============================================================================
      # PASSO CHAVE: Remove o numpy e scikit-learn do spec automaticamente antes de compilar
      # ==============================================================================
      - name: Purificar Requisitos do Buildozer
        run: |
          sed -i 's/numpy==1.26.4,//g' buildozer.spec
          sed -i 's/,numpy==1.26.4//g' buildozer.spec
          sed -i 's/scikit-learn==1.3.2,//g' buildozer.spec
          sed -i 's/,scikit-learn==1.3.2//g' buildozer.spec
          sed -i 's/numpy,//g' buildozer.spec
          sed -i 's/,numpy//g' buildozer.spec
          sed -i 's/scikit-learn,//g' buildozer.spec
          sed -i 's/,scikit-learn//g' buildozer.spec

      - name: Compilar APK com Buildozer
        run: |
          buildozer android release
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Guardar o APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: Guardiao-APK
          path: bin/*.apk
          
