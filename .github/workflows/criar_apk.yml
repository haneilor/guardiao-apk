name: Criar APK Guardiao

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Essencial para o Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libdb-dev libsqlite3-dev libffi-dev uuid-dev libgdbm-compat-dev
          sudo apt-get install -y ccache clang
          
      - name: Instalar Buildozer e ferramentas
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" "buildozer==1.5.0" wheel

      - name: Configurar Licenças do Android
        run: |
          if [ -f buildozer.spec ]; then
            sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true
            sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true
          fi

      - name: Compilar APK com Buildozer
        run: |
          buildozer android debug
        env:
          # Força as variáveis de ambiente a usarem o Java 17 configurado no passo anterior
          JAVA_HOME: ${{ env.JAVA_HOME }}
          APP_ANDROID_ARCHS: "arm64-v8a"

      - name: Salvar o APK pronto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-guardiao
          path: bin/*.apk
          
