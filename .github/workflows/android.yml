name: Compilar APK Guardiao IA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgfortran5 \
          libopenblas-dev \
          liblapack-dev \
          gfortran

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer virtualenv

    - name: Limpeza Absoluta de Cache
      run: |
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        buildozer android clean || true

    - name: Forçar Buildozer a Criar Estrutura de Pastas e Injetar SDK
      run: |
        # 1. Executa um comando simples do Buildozer para ele inicializar a pasta ~/.buildozer e baixar o NDK/SDK básico
        # Ele vai falhar ou parar, mas o importante é que a estrutura de pastas será criada
        buildozer android status || true

        # 2. Define o caminho do SDK que o Buildozer acabou de criar
        BUILDOZER_SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$BUILDOZER_SDK_DIR"

        # 3. Copia as ferramentas essenciais (build-tools que contém o 'aidl', platforms e platform-tools) 
        # direto do SDK robusto do GitHub Runner para dentro do diretório do Buildozer
        echo "Copiando componentes do SDK para o ambiente do Buildozer..."
        cp -r /usr/local/lib/android/sdk/build-tools "$BUILDOZER_SDK_DIR/" || true
        cp -r /usr/local/lib/android/sdk/platform-tools "$BUILDOZER_SDK_DIR/" || true
        cp -r /usr/local/lib/android/sdk/platforms "$BUILDOZER_SDK_DIR/" || true

        # 4. Cria a pasta de licenças aceitas para o Buildozer não tentar baixar nada novamente
        mkdir -p "$BUILDOZER_SDK_DIR/licenses"
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$BUILDOZER_SDK_DIR" --licenses || true

    - name: Compilar APK com Buildozer
      run: |
        # Agora o Buildozer executará a compilação encontrando a pasta 'build-tools' e o 'aidl' já posicionados no local correto
        buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Fazer Upload do APK Compilado
      uses: actions/upload-artifact@v4
      with:
        name: Guardiao-IA-APK
        path: bin/*.apk
        retention-days: 7
        
