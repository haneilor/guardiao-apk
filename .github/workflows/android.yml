name: Compilar APK Guardiao IA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgfortran5 \
          libopenblas-dev \
          liblapack-dev \
          gfortran

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer virtualenv

    - name: Limpar Cache do Buildozer
      run: |
        rm -rf .buildozer/

    - name: Instalar Build-Tools Estáveis e Aceitar Licenças
      run: |
        # 1. Configurações de ambiente para licenças
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # 2. Aceita licenças globais do Android SDK do Runner
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # 3. Força a instalação do build-tools 34.0.0 e plataformas compatíveis no SDK global
        # Isso garante que o binário 'aidl' e outros compiladores necessários estejam prontos
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"
        
        # 4. Inicializa a estrutura de pastas do Buildozer
        # Executando apenas uma inicialização leve para que as pastas existam
        buildozer android clean || true
        
        # 5. Define a pasta de destino onde o Buildozer espera encontrar o SDK
        BUILDOZER_SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$BUILDOZER_SDK_DIR/licenses"
        
        # 6. Aceita as licenças no SDK local que o Buildozer usa
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$BUILDOZER_SDK_DIR --licenses || true
        
        # 7. Copia as licenças aceitas para o Buildozer não perguntar de novo em tempo de compilação
        if [ -d "$ANDROID_HOME/licenses" ]; then
          cp -r "$ANDROID_HOME/licenses/"* "$BUILDOZER_SDK_DIR/licenses/" || true
        fi

    - name: Compilar APK com Buildozer
      run: |
        # Executa a compilação de forma direta e sem interações
        buildozer android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Fazer Upload do APK Compilado
      uses: actions/upload-artifact@v4
      with:
        name: Guardiao-IA-APK
        path: bin/*.apk
        retention-days: 7
        
