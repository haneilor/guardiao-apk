name: Compilar APK Guardiao IA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite que você inicie a compilação manualmente se quiser

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-python: '3.10'

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependências do Sistema (Compiladores e SDK)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgfortran5 \
          libopenblas-dev \
          liblapack-dev \
          gfortran

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Limpar Cache do Buildozer (Opcional/Seguro)
      run: |
        rm -rf .buildozer/

    - name: Compilar APK com Buildozer
      run: |
        # O buildozer exige aceitar os termos da licença do Android SDK de forma automática no terminal.
        yes | buildozer android debug
      env:
        # Define variáveis necessárias para evitar falhas de interação visual
        ANDROID_HOME: /usr/local/lib/android/sdk
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Fazer Upload do APK Compilado
      uses: actions/upload-artifact@v4
      with:
        name: Guardiao-IA-APK
        path: bin/*.apk
        retention-days: 7
        
