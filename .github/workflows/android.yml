    - name: Aceitar Licenças do Android SDK e Compilar
      run: |
        # 1. Força a criação do diretório padrão de licenças no diretório home do runner
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # 2. Roda o instalador do buildozer previamente para ele inicializar as pastas do SDK (sem compilar)
        # Isso faz com que a pasta buildozer-shared-sdk seja criada no local correto.
        buildozer android clean || true
        
        # 3. Define o caminho exato onde o Buildozer cria/instala o Android SDK
        BUILDOZER_SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$BUILDOZER_SDK_DIR/licenses"
        
        # 4. Aceita as licenças tanto no SDK global quanto no SDK local que o Buildozer acabou de preparar
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$BUILDOZER_SDK_DIR --licenses || true
        
        # 5. Copia os arquivos de licenças assinadas globalmente diretamente para dentro da pasta que o Buildozer usa
        if [ -d "$ANDROID_HOME/licenses" ]; then
          cp -r "$ANDROID_HOME/licenses/"* "$BUILDOZER_SDK_DIR/licenses/" || true
        fi

        # 6. Executa a compilação final em modo não-interativo
        buildozer android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        BUILDOZER_WARN_ON_ROOT: 0
        
