name: Compilar APK Guardiao IA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgfortran5 \
          libopenblas-dev \
          liblapack-dev \
          gfortran

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer virtualenv

    - name: Limpar Cache do Buildozer
      run: |
        rm -rf .buildozer/

    - name: Preparar SDK Manager e Aceitar Licenças
      run: |
        # 1. Criar estrutura de diretórios do SDK que o Buildozer usará
        BUILDOZER_SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$BUILDOZER_SDK_DIR/cmdline-tools"
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # 2. Copiar o cmdline-tools padrão do GitHub runner para a pasta do Buildozer
        # Isso resolve o erro de "sdkmanager does not exist"
        cp -r "$ANDROID_HOME/cmdline-tools/latest" "$BUILDOZER_SDK_DIR/cmdline-tools/latest"
        
        # 3. Criar link simbólico para compatibilidade com versões antigas do Buildozer que buscam pela pasta 'tools'
        mkdir -p "$BUILDOZER_SDK_DIR/tools/bin"
        ln -sf "$BUILDOZER_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK_DIR/tools/bin/sdkmanager"
        
        # 4. Aceitar todas as licenças usando o sdkmanager recém-estruturado
        yes | "$BUILDOZER_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILDOZER_SDK_DIR" --licenses || true
        
        # 5. Pré-instalar componentes críticos para evitar downloads falhos no meio do build
        "$BUILDOZER_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILDOZER_SDK_DIR" "build-tools;34.0.0" "platforms;android-34" "platform-tools"

    - name: Compilar APK com Buildozer
      run: |
        buildozer android debug
      env:
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Fazer Upload do APK Compilado
      uses: actions/upload-artifact@v4
      with:
        name: Guardiao-IA-APK
        path: bin/*.apk
        retention-days: 7
        
