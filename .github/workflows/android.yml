name: Compilar APK Guardiao IA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgfortran5 \
          libopenblas-dev \
          liblapack-dev \
          gfortran

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer virtualenv

    - name: Limpeza Absoluta de Cache
      run: |
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        buildozer android clean || true

    - name: Configurar SDK e Mapear Ferramentas Legadas
      run: |
        # 1. Configura repositório de licenças
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

        # 2. Aceita todas as licenças do SDK global do runner
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # 3. Garante a instalação do build-tools estável (34.0.0) e componentes necessários
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

        # 4. Cria compatibilidade estrutural para o sdkmanager antigo que o Buildozer procura
        # Mapeamos o executável moderno diretamente como um link dentro da pasta global do SDK do runner
        sudo mkdir -p "$ANDROID_HOME/tools/bin"
        sudo ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"

    - name: Compilar APK com Buildozer
      run: |
        # Executamos o build instruindo o Buildozer a usar o SDK global já configurado e com o 'aidl' instalado
        buildozer android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        BUILDOZER_WARN_ON_ROOT: 0
        
