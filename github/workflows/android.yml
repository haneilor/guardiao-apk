name: Compilar APK Guardiao IA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgfortran5 \
          libopenblas-dev \
          liblapack-dev \
          gfortran

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer virtualenv

    - name: Limpeza Absoluta de Cache Antigo
      run: |
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        buildozer android clean || true

    - name: Forçar Buildozer a Criar Estrutura de Pastas (Pre-Seeding)
      run: |
        # 1. Rodar um comando leve apenas para o Buildozer gerar os diretórios iniciais do SDK/NDK
        buildozer android status || true

        # 2. Caminhos das estruturas do SDK interno do Buildozer
        BUILDOZER_SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$BUILDOZER_SDK_DIR/cmdline-tools"
        mkdir -p "$BUILDOZER_SDK_DIR/tools/bin"

        # 3. Importar cmdline-tools estável do Runner para evitar bugs de download do Buildozer
        echo "Preparando ferramentas de comando no SDK do Buildozer..."
        cp -r "$ANDROID_HOME/cmdline-tools/latest" "$BUILDOZER_SDK_DIR/cmdline-tools/latest"
        
        # Link simbólico para o sdkmanager antigo exigido internamente pelo Buildozer
        ln -sf "$BUILDOZER_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK_DIR/tools/bin/sdkmanager"

        # 4. Copiar as pastas de build-tools (contendo o AIDL) e platforms pré-existentes no Runner
        # Isso economiza tempo e evita o erro clássico de "Aidl not found"
        echo "Injetando build-tools e platforms para dentro do SDK do Buildozer..."
        cp -r "$ANDROID_HOME/build-tools" "$BUILDOZER_SDK_DIR/"
        cp -r "$ANDROID_HOME/platform-tools" "$BUILDOZER_SDK_DIR/"
        cp -r "$ANDROID_HOME/platforms" "$BUILDOZER_SDK_DIR/"

        # 5. Aceitar licenças dentro do SDK mockado do Buildozer
        yes | "$BUILDOZER_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILDOZER_SDK_DIR" --licenses || true

    - name: Compilar APK com Buildozer
      run: |
        # Executar a compilação final. Agora o Buildozer encontrará o SDK completamente estruturado,
        # com todas as ferramentas necessárias (incluindo o sdkmanager legado e o aidl) em seus devidos lugares.
        buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Fazer Upload do APK Compilado
      uses: actions/upload-artifact@v4
      with:
        name: Guardiao-IA-APK
        path: bin/*.apk
        retention-days: 7
        
