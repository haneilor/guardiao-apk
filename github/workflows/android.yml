[app]

# (str) Title of your application
title = Guardiao IA

# (str) Package name
package.name = guardiaoia

# (str) Package domain (needed for android packaging)
package.domain = org.guardiao

# (str) Source code directory
source.dir = .

# (list) Source files to include (let empty to include all the files)
source.include_exts = py,png,jpg,kv,atlas,html,css,js

# (list) List of directory to exclude (let empty to not exclude anything)
source.include_patterns = templates/*, modulos/*

# (str) Application version
version = 1.0.0

# (list) Application requirements
# numpy e scikit-learn exigem compiladores C/C++/Fortran presentes no workflow do GitHub
requirements = python3,hostpython3,kivy,flask,numpy,scikit-learn,pyjnius

# (str) Supported orientations (one of landscape, portrait or all)
orientation = portrait

# (bool) Declare whether the application is fullscreen or not
fullscreen = 0

# (list) Permissions required by the application
# Permissões críticas para rastreamento de GPS, Notificações e Envio de SMS
android.permissions = INTERNET, ACCESS_FINE_LOCATION, ACCESS_COARSE_LOCATION, SEND_SMS, RECEIVE_BOOT_COMPLETED, FOREGROUND_SERVICE, POST_NOTIFICATIONS
android.features = android.hardware.telephony

# (int) Target Android API, should be as high as possible.
android.api = 34

# (int) Minimum API your APK will support.
# ALTERADO PARA 24: Exigido obrigatoriamente para a compilação do 'numpy'
android.minapi = 24

# (int) Android NDK API to use.
# ALTERADO PARA 24: Sincronizado para garantir compatibilidade de compilação nativa
android.ndk_api = 24

# (bool) Use private storage for data (True by default)
android.private_storage = True

# (list) Android architectures to build for (recomenda-se compilar para ARM64 moderno)
android.archs = armeabi-v7a, arm64-v8a

# (list) Foreground service types (Obrigatório a partir do Android 14 para serviços persistentes)
android.foreground_service_types = location, special_use

[buildozer]

# (int) Log level (0 = error only, 1 = info, 2 = debug (with command output))
log_level = 2

# (int) Display warning if buildozer is run as root (0 = False, 1 = True)
warn_on_root = 1
